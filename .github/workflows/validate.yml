name: TR Accounts validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate JavaScript syntax in index.html
        run: |
          python3 - <<'PY'
          import re
          html=open('index.html', encoding='utf-8').read()
          scripts=re.findall(r'<script>(.*?)</script>', html, re.S)
          if not scripts:
            raise SystemExit('No inline script found')
          open('/tmp/tr-accounts.js','w',encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/tr-accounts.js
      - name: Validate cloud module JavaScript syntax
        run: cp cloud.js /tmp/tr-accounts-cloud.mjs && node --check /tmp/tr-accounts-cloud.mjs
      - name: Validate Business Suite JavaScript syntax
        run: node --check business-suite.js
      - name: Verify security and data-safety guardrails
        run: |
          python3 - <<'PY'
          html = open('index.html', encoding='utf-8').read()
          cloud = open('cloud.js', encoding='utf-8').read()
          rules = open('firestore.rules', encoding='utf-8').read()
          assert 'APP_PIN_ATTEMPTS_KEY' in html and 'getAppPinAttempts()>=5' in html, 'PIN attempt limit/recovery visibility missing'
          assert 'Create new 4–8 digit PIN' in html and 'Create a new recovery code' in html, 'Recovery must replace PIN and recovery code'
          assert 'selfSmsVerifiedForCurrentPhone' in cloud and 'Cloud Sync blocked' in cloud, 'Cloud sync must require same-number Self-SMS check'
          assert r'if(!/^[6-9]\\d{9}$/.test(phone))return false;' not in cloud, 'Self-SMS regex must not contain escaped backslash before digit class'
          assert r'if(!/^[6-9]\d{9}$/.test(phone))return false;' in cloud, 'Self-SMS gate must accept valid 10-digit phone numbers'
          assert 'PhoneAuthProvider' not in cloud and 'phoneClaimVerified' not in cloud, 'Firebase SMS OTP auth must be removed'
          assert 'Send the pre-filled SMS to the same number' in cloud, 'Self-SMS must use the same entered number'
          assert 'Self-SMS is manual' in html, 'UI must disclose manual Self-SMS limitation'
          assert 'sync-conflict-' in cloud and 'syncConflict:true' in cloud, 'Sync conflict preservation missing'
          assert 'allow read: if owner(uid) || approvedDevice(uid)' in rules, 'Firestore owner sync must require signed-in owner UID'
          assert 'allow read, write: if owner(uid) || approvedDevice(uid)' in rules, 'Sync entry access must be owner or approved device'
          print('Security guardrail assertions passed')
          PY
      - name: Validate JSON files
        run: |
          python3 -m json.tool manifest.webmanifest >/dev/null
