name: TR Accounts validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Validate JavaScript syntax in index.html
        run: |
          python3 - <<'PY'
          import re
          html=open('index.html', encoding='utf-8').read()
          scripts=re.findall(r'<script(?:\s+type=["\']module["\'])?>(.*?)</script>', html, re.S)
          if not scripts:
            raise SystemExit('No inline script found')
          open('/tmp/tr-accounts.mjs','w',encoding='utf-8').write(scripts[-1])
          PY
          node --check /tmp/tr-accounts.mjs
      - name: Validate encrypted local storage JavaScript
        run: cp storage.js /tmp/tr-accounts-storage.js && node --check /tmp/tr-accounts-storage.js
      - name: Validate cloud module JavaScript syntax
        run: cp cloud.js /tmp/tr-accounts-cloud.mjs && node --check /tmp/tr-accounts-cloud.mjs
      - name: Validate Business Suite JavaScript
        run: node --check business-suite.js
      - name: Verify security and data-safety guardrails
        run: |
          python3 - <<'PY'
          html = open('index.html', encoding='utf-8').read()
          cloud = open('cloud.js', encoding='utf-8').read()
          rules = open('firestore.rules', encoding='utf-8').read()
          storage = open('storage.js', encoding='utf-8').read()
          assert 'AES-GCM' in storage and 'device-data-key' in storage and 'crypto.subtle.generateKey' in storage, 'Automatic device encryption key and AES-GCM local encryption missing'
          assert 'TRSecureStorage' in storage and 'TRSecurePlugin' in open('.github/workflows/build-apk.yml', encoding='utf-8').read() and 'AndroidKeyStore' in open('.github/workflows/build-apk.yml', encoding='utf-8').read(), 'Native Android Keystore integration missing'
          assert 'chooseBackupFolder' in storage and 'autoBackup' in storage, 'Automatic encrypted backup folder support missing'
          assert '@capacitor/filesystem' in open('package.json', encoding='utf-8').read() and '.TRAccounts/Backup' in storage, 'Android Documents backup folder integration missing'
          build_workflow = open('.github/workflows/build-apk.yml', encoding='utf-8').read()
          assert 'retention-days: 30' not in build_workflow and 'retention-days:' not in build_workflow, 'APK Actions artifact must not have a hard-coded short retention'
          assert 'softprops/action-gh-release@v3.0.4' in build_workflow and 'actions/upload-artifact@v6' in build_workflow and 'files: verified/TR-Accounts-v1.0.apk' in build_workflow, 'APK must use Node 24-compatible release/artifact actions and publish a permanent download asset'
          assert 'Force Android launcher icon to the TR logo' in build_workflow and 'android:icon="@mipmap/ic_launcher"' in build_workflow and 'android:roundIcon="@mipmap/ic_launcher_round"' in build_workflow, 'Android launcher must explicitly use generated TR logo icon resources'
          assert '@drawable/ic_launcher_foreground' in build_workflow, 'Adaptive launcher icon must reference density-independent generated TR logo foreground'
          assert 'TRAccountsCloudBackupEncrypt' in cloud and 'TR-CLOUD-ENC-1' in cloud, 'Gmail-authenticated cloud backup encryption/recovery missing'
          assert 'encryptCloudItem' in cloud and 'decryptCloudItem' in cloud and 'keyRecovery' in cloud, 'Encrypted Firestore sync/key escrow missing'
          assert 'TR-CLOUD-ENC-1' in html and 'TR-LOCAL-ENC-1' in html, 'Encrypted backup restore formats missing'
          assert 'encrypted:true' in storage and 'ciphertext' in storage, 'Proof attachment encryption missing'
          assert 'storageLocked' in storage and 'unlockAfterRestore' in storage, 'Encrypted-data recovery lock and restore-safe guard missing'
          assert 'await TRStorage.load()' in html, 'Encrypted storage async initialization missing'
          assert 'APP_PIN_ATTEMPTS_KEY' in html and 'getAppPinAttempts()>=5' in html, 'PIN attempt limit/recovery visibility missing'
          assert 'Create new 4–8 digit PIN' in html and 'Create a new recovery code' in html, 'Recovery must replace PIN and recovery code'
          assert 'allow read, write: if owner(uid) || approvedDevice(uid)' in rules and 'function approvedDevice(uid)' in rules, 'Firestore sync must enforce owner or approved-device UID'
          assert 'TR Accounts Logo' in html and 'trLoginForgot' in html and 'attempts>=5' in html, 'PIN login logo or 5-failure recovery visibility missing'
          assert 'trRecoveryGoogle' in html and 'trRecoveryPhone' in html and 'Login with Gmail' in html, 'Gmail + registered phone PIN recovery UI missing'
          assert 'Verify Gmail & Phone' in html and 'Create New PIN' in html and 'Save New PIN' in html, 'Gmail/phone PIN reset flow missing'
          assert 'Register Now' in html and 'regGmailLogin' not in html and 'First sign in with Gmail / Google.' not in html, 'Local-first registration without Gmail gate missing'
          assert 'selfSmsVerifyBtn' not in html and 'tr_accounts_self_sms_verified_v1' not in cloud, 'Profile Self-SMS verification must be removed'
          assert 'TRSmsPlugin' not in build_workflow and 'SEND_SMS' not in build_workflow and 'RECEIVE_SMS' not in build_workflow and 'READ_PHONE_STATE' not in build_workflow, 'APK must not add SMS or phone-state permissions'
          assert 'sync-conflict-' in cloud and 'syncConflict:true' in cloud, 'Sync conflict preservation missing'
          assert 'fingerprintUnlockEnabled' in html and 'tr_accounts_fingerprint_unlock_enabled_v1' in html and 'initTRBiometric' in html, 'Fingerprint unlock setting and persistent preference missing'
          assert 'Set App PIN first' in html and 'requested&&!pinHash' in html, 'Fingerprint must require App PIN fallback before enabling'
          assert 'modePinSkip' in html and 'Skip PIN & Switch' in html and 'switchPinSkip' in html, 'Optional Personal/Business Switching PIN Skip/Disable flow missing'
          assert 'profileGmailStatusCard' not in html and 'id="profileLogout"' not in html, 'Profile must show Gmail email once and keep a single visible Login/Logout button'
          assert 'verifyEntrySet' in cloud and 'Cloud: sync verified' in cloud and 'await syncData();' in cloud, 'Cloud Sync must perform full merge and read-back verification'
          assert 'allow read: if owner(uid) || approvedDevice(uid)' in rules, 'Firestore profile access must require signed-in owner UID'
          print('Security guardrail assertions passed')
          PY
      - name: Validate JSON files
        run: python3 -m json.tool manifest.webmanifest >/dev/null
