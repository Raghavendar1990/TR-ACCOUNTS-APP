name: Build iOS Simulator App
permissions:
  contents: read
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Prepare shared web app
        run: |
          mkdir -p web
          cp index.html storage.js manifest.webmanifest sw.js cloud.js business-suite.js firebase-config.js 'trlogo-1024(1).png' web/
          cp -r icons web/icons
      - run: npm install
      - run: npx esbuild cloud.js --bundle --format=esm --outfile=web/cloud.js
      - name: Add iOS platform and sync
        run: |
          npx cap add ios
          npx cap sync ios
      - name: Build for iOS Simulator
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Package simulator app
        run: |
          APP=$(find ios/App -path '*Build/Products/Debug-iphonesimulator/App.app' -type d | head -n 1)
          test -n "$APP"
          ditto -c -k --sequesterRsrc --keepParent "$APP" TR-Accounts-iOS-Simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TR-Accounts-iOS-Simulator
          path: TR-Accounts-iOS-Simulator.zip
          retention-days: 14
