name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p web && cp index.html storage.js manifest.webmanifest sw.js cloud.js business-suite.js firebase-config.js TR_Accounts_Logo_Transparent-1.png web/ && cp -r icons web/icons
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set Android app version
        run: sed -i -E 's/versionCode [0-9]+/versionCode 17/; s/versionName "[^"]+"/versionName "1.1.6"/' android/app/build.gradle
      - name: Build APK
        run: cd android && ./gradlew assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          mkdir -p verified
          cp "$APK" verified/TR-Accounts-v1.1.6.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TR-Accounts-v1.1.6-Verified-APK
          path: verified/TR-Accounts-v1.1.6.apk
          retention-days: 30
