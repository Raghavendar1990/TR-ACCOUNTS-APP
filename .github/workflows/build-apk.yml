name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p web && cp index.html storage.js manifest.webmanifest sw.js cloud.js business-suite.js firebase-config.js 'trlogo-1024(1).png' web/ && cp -r icons web/icons
      - run: npm install
      - run: npx esbuild cloud.js --bundle --format=esm --outfile=web/cloud.js
      - name: Configure Firebase Android and sync Capacitor
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          # Add native SIM-aware SMS bridge for the profile OTP self-check.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main')
          gradle=Path('android/app/build.gradle').read_text()
          namespace=re.search(r'namespace\s+[\'\"]([\w.]+)[\'\"]',gradle).group(1)
          main=next(root.rglob('MainActivity.*'))
          pkg=namespace
          plugin=root/'java'/Path(*pkg.split('.'))/'TRSmsPlugin.java'
          plugin.parent.mkdir(parents=True,exist_ok=True)
          plugin.write_text("""package %s;
          import android.Manifest; import android.content.*; import android.os.Build; import android.telephony.*; import android.app.PendingIntent;
          import com.getcapacitor.*; import com.getcapacitor.annotation.*; import java.util.*;
          @CapacitorPlugin(name="TRSms", permissions={@Permission(alias="sms", strings={Manifest.permission.SEND_SMS,Manifest.permission.RECEIVE_SMS,Manifest.permission.READ_PHONE_STATE})})
          public class TRSmsPlugin extends Plugin {
            private BroadcastReceiver receiver;
            @Override public void load(){ receiver=new BroadcastReceiver(){ public void onReceive(Context c,Intent i){ if("android.provider.Telephony.SMS_RECEIVED".equals(i.getAction())){ for(SmsMessage m:Telephony.Sms.Intents.getMessagesFromIntent(i)){ if(m!=null) notifyListeners("smsReceived",new JSObject().put("body",m.getMessageBody()).put("sender",m.getOriginatingAddress())); } } } }; IntentFilter f=new IntentFilter("android.provider.Telephony.SMS_RECEIVED"); if(Build.VERSION.SDK_INT>=33)getContext().registerReceiver(receiver,f,Context.RECEIVER_EXPORTED);else getContext().registerReceiver(receiver,f); }
            @Override protected void handleOnDestroy(){try{if(receiver!=null)getContext().unregisterReceiver(receiver);}catch(Exception ignored){}}
            @PluginMethod public void requestSmsPermission(PluginCall call){ if(getPermissionState("sms")!=PermissionState.GRANTED){requestPermissionForAlias("sms",call,"smsPerm");}else call.resolve(); }
            @PermissionCallback private void smsPerm(PluginCall call){ if(getPermissionState("sms")==PermissionState.GRANTED)call.resolve();else call.reject("SMS permission denied");}
            @PluginMethod public void sendSelfSms(PluginCall call){String phone=call.getString("phone"),message=call.getString("message");Integer slot=call.getInt("simSlot"); if(phone==null||message==null||slot==null){call.reject("Missing phone, message or SIM slot");return;} if(getPermissionState("sms")!=PermissionState.GRANTED){call.reject("SMS permission not granted");return;} try{SubscriptionManager sm=(SubscriptionManager)getContext().getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);List<SubscriptionInfo> list=sm.getActiveSubscriptionInfoList();SubscriptionInfo selected=null;if(list!=null)for(SubscriptionInfo si:list)if(si.getSimSlotIndex()==slot-1){selected=si;break;}if(selected==null){call.reject("Selected SIM slot is not active");return;}SmsManager manager=SmsManager.getSmsManagerForSubscriptionId(selected.getSubscriptionId());ArrayList<String> parts=manager.divideMessage(message);manager.sendMultipartTextMessage(phone,null,parts,null,null);call.resolve(new JSObject().put("sent",true).put("slot",slot));}catch(Exception e){call.reject("SMS send failed: "+e.getMessage(),e);} }
          }
          """ % pkg)
          text=main.read_text()
          if 'TRSmsPlugin' not in text:
            if main.suffix=='.java':
              text=text.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(TRSmsPlugin.class);\n        super.onCreate(savedInstanceState);\n    }')
            else:
              text=text.replace('class MainActivity : BridgeActivity() {', 'class MainActivity : BridgeActivity() {\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        registerPlugin(TRSmsPlugin::class.java)\n        super.onCreate(savedInstanceState)\n    }')
            main.write_text(text)
          manifest=root/'AndroidManifest.xml'; m=manifest.read_text()
          m=m.replace('<manifest ', '<manifest\n    xmlns:tools="http://schemas.android.com/tools" ',1) if 'xmlns:tools' not in m else m
          m=m.replace('<application', '<uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <application',1)
          manifest.write_text(m)
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          variables = Path("android/variables.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(marker, marker + chr(10) + "        classpath 'com.google.gms:google-services:4.4.4'", 1)
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              marker = "apply plugin: 'com.android.application'"
              if marker not in app_text:
                  raise SystemExit("Could not locate Android application plugin")
              app_text = app_text.replace(marker, marker + chr(10) + "apply plugin: 'com.google.gms.google-services'", 1)
              app.write_text(app_text)
          if variables.exists():
              v = variables.read_text()
              if "rgcfaIncludeGoogle" not in v:
                  marker = "ext {"
                  if marker not in v:
                      raise SystemExit("Could not locate variables.gradle ext block")
                  v = v.replace(marker, marker + chr(10) + "    rgcfaIncludeGoogle = true" + chr(10) + "    androidxCredentialsVersion = '1.3.0'", 1)
                  variables.write_text(v)
          PY
          npx cap sync android
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          im=Image.open('trlogo-1024(1).png').convert('RGBA')
          for d,s in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
           p=Path('android/app/src/main/res')/d;p.mkdir(parents=True,exist_ok=True)
           im.resize((s,s),Image.Resampling.LANCZOS).save(p/'ic_launcher.png')
           im.resize((s,s),Image.Resampling.LANCZOS).save(p/'ic_launcher_round.png')
          PY
      - name: Configure optional stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Stable signing secrets not configured; using Android debug signing for this build."
            exit 0
          fi
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/tr-accounts-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          """
          if "ANDROID_KEYSTORE_PATH" not in s:
              s = s.replace("android {", "android {" + block, 1)
              p.write_text(s)
          PY
      - name: Set Android app version
        run: sed -i -E 's/versionCode [0-9]+/versionCode 25/; s/versionName "[^"]+"/versionName "2.0.7"/' android/app/build.gradle
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/tr-accounts-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          mkdir -p verified
          cp "$APK" verified/TR-Accounts-v2.0.8.apk
          rm -f android/app/keystore/tr-accounts-release.jks
      - uses: actions/upload-artifact@v5
        with:
          name: TR-Accounts-v2.0.8-SIM-SMS-OTP
          path: verified/TR-Accounts-v2.0.7.apk
          retention-days: 30
