name: Build Android APK
permissions:
  contents: write
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: mkdir -p web && cp index.html storage.js manifest.webmanifest sw.js cloud.js business-suite.js firebase-config.js 'trlogo-1024(1).png' web/ && cp -r icons web/icons
      - run: npm install
      - run: npx esbuild cloud.js --bundle --format=esm --outfile=web/cloud.js
      - name: Configure Firebase Android and sync Capacitor
        run: |
          npx cap add android
          cp google-services.json android/app/google-services.json
          # Add native SIM-aware SMS bridge for the profile OTP self-check.
          python3 - <<'PY'
          from pathlib import Path
          import re
          root=Path('android/app/src/main')
          gradle=Path('android/app/build.gradle').read_text()
          namespace=re.search(r'namespace\s+[\'\"]([\w.]+)[\'\"]',gradle).group(1)
          main=next(root.rglob('MainActivity.*'))
          pkg=namespace
          plugin=root/'java'/Path(*pkg.split('.'))/'TRSmsPlugin.java'
          plugin.parent.mkdir(parents=True,exist_ok=True)
          plugin.write_text("""package %s;
          import android.Manifest; import android.content.*; import android.os.Build; import android.telephony.*; import android.app.PendingIntent;
          import com.getcapacitor.*; import com.getcapacitor.annotation.*; import java.util.*;
          @CapacitorPlugin(name="TRSms", permissions={@Permission(alias="sms", strings={Manifest.permission.SEND_SMS,Manifest.permission.RECEIVE_SMS,Manifest.permission.READ_PHONE_STATE})})
          public class TRSmsPlugin extends Plugin {
            private BroadcastReceiver receiver;
            @Override public void load(){ receiver=new BroadcastReceiver(){ public void onReceive(Context c,Intent i){ if("android.provider.Telephony.SMS_RECEIVED".equals(i.getAction())){ for(SmsMessage m:android.provider.Telephony.Sms.Intents.getMessagesFromIntent(i)){ if(m!=null) notifyListeners("smsReceived",new JSObject().put("body",m.getMessageBody()).put("sender",m.getOriginatingAddress())); } } } }; IntentFilter f=new IntentFilter("android.provider.Telephony.SMS_RECEIVED"); if(Build.VERSION.SDK_INT>=33)getContext().registerReceiver(receiver,f,Context.RECEIVER_EXPORTED);else getContext().registerReceiver(receiver,f); }
            @Override protected void handleOnDestroy(){try{if(receiver!=null)getContext().unregisterReceiver(receiver);}catch(Exception ignored){}}
            @PluginMethod public void requestSmsPermission(PluginCall call){ if(getPermissionState("sms")!=PermissionState.GRANTED){requestPermissionForAlias("sms",call,"smsPerm");}else call.resolve(); }
            @PermissionCallback private void smsPerm(PluginCall call){ if(getPermissionState("sms")==PermissionState.GRANTED)call.resolve();else call.reject("SMS permission denied");}
            @PluginMethod public void sendSelfSms(PluginCall call){String phone=call.getString("phone"),message=call.getString("message");Integer slot=call.getInt("simSlot"); if(phone==null||message==null||slot==null){call.reject("Missing phone, message or SIM slot");return;} if(getPermissionState("sms")!=PermissionState.GRANTED){call.reject("SMS permission not granted");return;} try{SubscriptionManager sm=(SubscriptionManager)getContext().getSystemService(Context.TELEPHONY_SUBSCRIPTION_SERVICE);List<SubscriptionInfo> list=sm.getActiveSubscriptionInfoList();SubscriptionInfo selected=null;if(list!=null)for(SubscriptionInfo si:list)if(si.getSimSlotIndex()==slot-1){selected=si;break;}if(selected==null){call.reject("Selected SIM slot is not active");return;}SmsManager manager=SmsManager.getSmsManagerForSubscriptionId(selected.getSubscriptionId());ArrayList<String> parts=manager.divideMessage(message);manager.sendMultipartTextMessage(phone,null,parts,null,null);call.resolve(new JSObject().put("sent",true).put("slot",slot));}catch(Exception e){call.reject("SMS send failed: "+e.getMessage(),e);} }
          }
          """ % pkg)
          secure=root/'java'/Path(*pkg.split('.'))/'TRSecurePlugin.java'
          secure.write_text("""package %s;
          import android.security.keystore.KeyGenParameterSpec; import android.security.keystore.KeyProperties; import android.util.Base64; import java.nio.charset.StandardCharsets; import java.security.KeyStore; import javax.crypto.Cipher; import javax.crypto.KeyGenerator; import javax.crypto.SecretKey; import javax.crypto.spec.GCMParameterSpec; import com.getcapacitor.*; import com.getcapacitor.annotation.*;
          @CapacitorPlugin(name="TRSecureStorage")
          public class TRSecurePlugin extends Plugin {
            private static final String ALIAS="TRAccountsDataKey";
            private SecretKey getKey() throws Exception { KeyStore ks=KeyStore.getInstance("AndroidKeyStore"); ks.load(null); if(ks.containsAlias(ALIAS)) return (SecretKey)ks.getKey(ALIAS,null); KeyGenerator kg=KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES,"AndroidKeyStore"); kg.init(new KeyGenParameterSpec.Builder(ALIAS,KeyProperties.PURPOSE_ENCRYPT|KeyProperties.PURPOSE_DECRYPT).setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).setKeySize(256).build()); return kg.generateKey(); }
            @PluginMethod public void secureEncrypt(PluginCall call){try{String data=call.getString("data");boolean isBase64=call.getBoolean("isBase64",false);if(data==null){call.reject("Missing data");return;}byte[] input=isBase64?Base64.decode(data,Base64.DEFAULT):data.getBytes(StandardCharsets.UTF_8);Cipher cipher=Cipher.getInstance("AES/GCM/NoPadding");cipher.init(Cipher.ENCRYPT_MODE,getKey());byte[] encrypted=cipher.doFinal(input);call.resolve(new JSObject().put("iv",Base64.encodeToString(cipher.getIV(),Base64.NO_WRAP)).put("ciphertext",Base64.encodeToString(encrypted,Base64.NO_WRAP)));}catch(Exception e){call.reject("Keystore encryption failed: "+e.getMessage(),e);}}
            @PluginMethod public void secureDecrypt(PluginCall call){try{String iv=call.getString("iv"),ciphertext=call.getString("ciphertext");boolean isBase64=call.getBoolean("isBase64",false);if(iv==null||ciphertext==null){call.reject("Missing IV or ciphertext");return;}Cipher cipher=Cipher.getInstance("AES/GCM/NoPadding");cipher.init(Cipher.DECRYPT_MODE,getKey(),new GCMParameterSpec(128,Base64.decode(iv,Base64.DEFAULT)));byte[] plain=cipher.doFinal(Base64.decode(ciphertext,Base64.DEFAULT));String result=isBase64?Base64.encodeToString(plain,Base64.NO_WRAP):new String(plain,StandardCharsets.UTF_8);call.resolve(new JSObject().put("data",result));}catch(Exception e){call.reject("Keystore decryption failed: "+e.getMessage(),e);}}
          }
          """ % pkg)
          text=main.read_text()
          if 'TRSmsPlugin' not in text:
            if main.suffix=='.java':
              text=text.replace('public class MainActivity extends BridgeActivity {', 'public class MainActivity extends BridgeActivity {\n    @Override public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(TRSmsPlugin.class);\n        registerPlugin(TRSecurePlugin.class);\n        super.onCreate(savedInstanceState);\n    }')
            else:
              text=text.replace('class MainActivity : BridgeActivity() {', 'class MainActivity : BridgeActivity() {\n    override fun onCreate(savedInstanceState: android.os.Bundle?) {\n        registerPlugin(TRSmsPlugin::class.java)\n        registerPlugin(TRSecurePlugin::class.java)\n        super.onCreate(savedInstanceState)\n    }')
            main.write_text(text)
          manifest=root/'AndroidManifest.xml'; m=manifest.read_text()
          m=m.replace('<manifest ', '<manifest\n    xmlns:tools="http://schemas.android.com/tools" ',1) if 'xmlns:tools' not in m else m
          m=m.replace('<application', '<uses-permission android:name="android.permission.SEND_SMS" />\n    <uses-permission android:name="android.permission.RECEIVE_SMS" />\n    <uses-permission android:name="android.permission.READ_PHONE_STATE" />\n    <application',1)
          manifest.write_text(m)
          PY
          python3 - <<'PY'
          from pathlib import Path
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          variables = Path("android/variables.gradle")
          root_text = root.read_text()
          if "com.google.gms:google-services" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(marker, marker + chr(10) + "        classpath 'com.google.gms:google-services:4.4.4'", 1)
              root.write_text(root_text)
          app_text = app.read_text()
          if "com.google.gms.google-services" not in app_text:
              marker = "apply plugin: 'com.android.application'"
              if marker not in app_text:
                  raise SystemExit("Could not locate Android application plugin")
              app_text = app_text.replace(marker, marker + chr(10) + "apply plugin: 'com.google.gms.google-services'", 1)
              app.write_text(app_text)
          if variables.exists():
              v = variables.read_text()
              if "rgcfaIncludeGoogle" not in v:
                  marker = "ext {"
                  if marker not in v:
                      raise SystemExit("Could not locate variables.gradle ext block")
                  v = v.replace(marker, marker + chr(10) + "    rgcfaIncludeGoogle = true" + chr(10) + "    androidxCredentialsVersion = '1.3.0'", 1)
                  variables.write_text(v)
          PY
          npx cap sync android
          python3 -m pip install Pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          root=Path('android/app/src/main/res')
          im=Image.open('trlogo-1024(1).png').convert('RGBA')
          # Pad logo for Android adaptive-icon safe area and create launcher assets.
          def padded_icon(size):
           canvas=Image.new('RGBA',(size,size),(0,0,0,0))
           logo=im.resize((int(size*0.72),int(size*0.72)),Image.Resampling.LANCZOS)
           canvas.alpha_composite(logo,((size-logo.width)//2,(size-logo.height)//2))
           return canvas
          for d,s in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
           p=root/d;p.mkdir(parents=True,exist_ok=True)
           icon=padded_icon(s)
           icon.save(p/'ic_launcher.png')
           icon.save(p/'ic_launcher_round.png')
          fg=root/'mipmap-xxxhdpi'; fg.mkdir(parents=True,exist_ok=True)
          padded_icon(192).save(fg/'ic_launcher_foreground.png')
          adaptive=root/'mipmap-anydpi-v26';adaptive.mkdir(parents=True,exist_ok=True)
          adaptive.joinpath('ic_launcher.xml').write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          adaptive.joinpath('ic_launcher_round.xml').write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@mipmap/ic_launcher_foreground"/></adaptive-icon>')
          colors=root/'values';colors.mkdir(parents=True,exist_ok=True)
          colors.joinpath('ic_launcher_background.xml').write_text('<resources><color name="ic_launcher_background">#FFFFFF</color></resources>')
          PY
      - name: Force Android launcher icon to the TR logo
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          # Explicitly point both launcher icon variants at freshly generated resources.
          text=re.sub(r'<application\\b', '<application android:icon="@mipmap/ic_launcher" android:roundIcon="@mipmap/ic_launcher_round"', text, count=1)
          manifest.write_text(text)
          res=Path('android/app/src/main/res')
          # Put the adaptive foreground in drawable-nodpi so resource lookup is density-independent.
          source=res/'mipmap-xxxhdpi'/'ic_launcher_foreground.png'
          target=res/'drawable-nodpi'; target.mkdir(parents=True,exist_ok=True)
          if source.exists():
            import shutil
            shutil.copy2(source,target/'ic_launcher_foreground.png')
          for name in ('ic_launcher.xml','ic_launcher_round.xml'):
            p=res/'mipmap-anydpi-v26'/name
            if p.exists():
              p.write_text('<adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android"><background android:drawable="@color/ic_launcher_background"/><foreground android:drawable="@drawable/ic_launcher_foreground"/></adaptive-icon>')
          PY
      - name: Configure optional stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ] || [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Stable signing secrets not configured; using Android debug signing for this build."
            exit 0
          fi
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/keystore/tr-accounts-release.jks
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv('ANDROID_KEYSTORE_PATH'))
                      storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.release
                  }
              }
          """
          if "ANDROID_KEYSTORE_PATH" not in s:
              s = s.replace("android {", "android {" + block, 1)
              p.write_text(s)
          PY
      - name: Set Android app version
        run: sed -i -E 's/versionCode [0-9]+/versionCode 28/; s/versionName "[^"]+"/versionName "2.1.0"/' android/app/build.gradle
      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/keystore/tr-accounts-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: cd android && ./gradlew assembleDebug
      - name: Verify APK signature and package
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)
          "$APKSIGNER" verify --verbose "$APK"
          "$AAPT" dump badging "$APK" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          mkdir -p verified
          cp "$APK" verified/TR-Accounts-v2.1.0.apk
          rm -f android/app/keystore/tr-accounts-release.jks
      - uses: actions/upload-artifact@v5
        with:
          name: TR-Accounts-v2.1.0-APK
          path: verified/TR-Accounts-v2.1.0.apk
      - name: Publish permanent APK release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: TR Accounts APK build ${{ github.run_number }}
          files: verified/TR-Accounts-v2.1.0.apk
          draft: false
          prerelease: false
